<body>
  <header class="toolbar">
    <nav class="modes">
      <a href="#home" data-view="home">Home</a>
      <a href="#learn" data-view="learn">Lessons</a>
      <a href="#pad" data-view="pad">Practice</a>
      <a href="#quiz" data-view="quiz">Quiz</a>
      <a href="#strokes" data-view="strokes">Strokes</a>
      <a href="#ref" data-view="ref">Reference</a>
    </nav>
    <div class="tools for-pad">
      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <div class="tools for-strokes">
      <button id="replay-all" type="button">Replay all</button>
    </div>
    <button id="menu-btn" class="menu-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu" title="Theme, writing and progress settings">⚙<span class="menu-label"> Settings</span></button>
  </header>
  <div id="menu" class="menu" role="dialog" aria-label="Settings" hidden>
    <section>
      <h3>Theme</h3>
      <div id="themes" class="theme-picks" role="radiogroup" aria-label="Theme"></div>
    </section>
    <section class="for-pad">
      <h3>Writing</h3>
      <label class="ctl">Line spacing
        <input id="spacing" type="range" min="32" max="96" step="4">
        <output id="spacing-out"></output>
      </label>
      <label class="ctl">Pen thickness
        <input id="pen-width" type="range" min="1" max="6" step="0.2">
        <output id="pen-width-out"></output>
      </label>
      <label class="ctl"><input id="finger" type="checkbox"> Finger ink <small>(off: only a pen or the mouse writes)</small></label>
      <label class="ctl guide-ctl"><input id="guide-on" type="checkbox"> Guide <small>(the example on the top rule, hints as you write)</small></label>
      <button id="export" type="button">Export JSON</button>
    </section>
    <section>
      <h3>Progress</h3>
      <div class="menu-row">
        <button id="backup" type="button" title="Save all progress to a file (lessons, practice, quiz history, writing size)">Back up</button>
        <button id="restore" type="button" title="Load progress from a backup file, replacing what is here">Restore</button>
        <button id="reset-all" class="danger" type="button" title="Clear all practice, scores, quiz history and your learned writing size">Reset</button>
      </div>
      <input id="restore-file" type="file" accept="application/json,.json" hidden>
    </section>
  </div>
  <main id="practice" class="practice view" data-view="pad quiz learn">
    <aside class="example-panel" aria-label="Example to copy">
      <select id="level-select" class="level-select" aria-label="Level"></select>
      <div class="ex-nav">
        <button id="ex-prev" type="button">◀ Prev</button>
        <button id="ex-replay" type="button">Replay</button>
        <button id="ex-next" type="button">Next ▶</button>
      </div>
      <div id="ex-counter" class="ex-counter"></div>
      <div id="ex-art" class="example-art"></div>
      <h2 id="ex-title" class="ex-title"></h2>
      <section class="feedback" aria-label="Your attempt">
        <div class="score-row">
          <div id="ex-score" class="score empty">–</div>
          <div id="ex-verdict" class="verdict">Write the example on the pad.</div>
          <div id="ex-repeat-hint" class="repeat-hint"></div>
        </div>
        <ul id="ex-critiques" class="critiques"></ul>
      </section>
      <div id="ex-meaning" class="ex-meaning"></div>
      <div id="ex-source" class="ex-source"></div>
      <div id="ex-status" class="ex-status" aria-live="polite"></div>
    </aside>
    <aside id="quiz-panel" class="example-panel quiz-panel" aria-label="Quiz" hidden></aside>
    <aside id="lesson-panel" class="example-panel lesson-panel" aria-label="Lesson"></aside>
    <div id="split" class="split" role="separator" tabindex="0" aria-label="Drag to resize the panel and the pad" title="Drag to resize (double-tap to reset)"><span></span></div>
    <div id="page" class="page">
      <svg id="model" class="guide-layer" aria-hidden="true"></svg>
      <svg id="guide" class="guide-layer" aria-hidden="true"></svg>
      <svg id="check" class="guide-layer" aria-hidden="true"></svg>
      <canvas id="ink"></canvas>
      <div id="line-picks" class="line-picks for-pad" aria-label="Show stats for one line"></div>
      <div id="hint" class="hint" aria-live="polite"></div>
      <span id="stats" class="stats for-pad" aria-live="polite"></span>
    </div>
  </main>
  <main id="home" class="home view" data-view="home" hidden></main>
  <main id="gallery" class="gallery view" data-view="strokes" hidden></main>
  <main id="reference" class="reference view" data-view="ref" hidden></main>
</body>
</html>
